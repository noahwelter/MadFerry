name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  coordinator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python -m madferry_coordinator check --data ../data

  ferrykit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path app/FerryKit
